<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>คำสั่งวนซ้ำ for: ตัวจำลอง Arduino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../engine/arduino-sim.css">
</head>
<body>
<div id="app"></div>
<script src="../engine/arduino-core.js"></script>
<script src="../engine/arduino-sim.js"></script>
<script>
ArduinoSim.mount({
  title: "คำสั่งวนซ้ำ for",
  back: "../index.html",
  lede: "บทที่ 2 หัวข้อ 2.5.5 ดูว่า for ทำงานเป็นขั้นอย่างไร: กำหนดค่าเริ่มต้นครั้งเดียว แล้ววนตรวจเงื่อนไข ทำคำสั่งในลูป และเปลี่ยนค่า จนกว่าเงื่อนไขจะเป็นเท็จ",
  serial: true,
  trace: {
    title: "ตารางติดตามค่า (หนึ่งแถวต่อการตรวจเงื่อนไขของ for หนึ่งครั้ง)",
    stmt: "for", on: "cond",
    empty: "ยังไม่ได้ตรวจเงื่อนไขของ for",
    cols: [{ label: "ครั้งที่", n: true }, { label: "i", var: "i" }, { label: "เงื่อนไข", cond: true, hl: true }, { label: "sum ตอนตรวจ", var: "sum" }],
  },
  missions: [
    { title: "for ที่บวก 1 ถึง 4", code: `void setup() {
  Serial.begin(9600);
  int sum = 0;                    // ผลรวม เริ่มจาก 0
  for (int i = 1; i <= 4; i++) {
    sum = sum + i;                // เพิ่ม i
    Serial.println(sum);
  }
  Serial.print("Sum = ");
  Serial.println(sum);
}

void loop() {
}
`,
      text: "กด “ทำบรรทัดถัดไป” ไปเรื่อย ๆ ดูว่าแถบสีเหลืองย้อนกลับขึ้นไปที่บรรทัด for เมื่อใด และค่าของ i กับ sum ในค่าในหน่วยความจำเปลี่ยนอย่างไรในแต่ละรอบ",
      q: "คำถาม: บรรทัด sum = sum + i ทำงานกี่ครั้ง และตอนที่เงื่อนไขเป็นเท็จ i มีค่าเท่าใด" },
    { title: "เปลี่ยน <= เป็น <", code: `void setup() {
  Serial.begin(9600);
  int sum = 0;                    // ผลรวม เริ่มจาก 0
  for (int i = 1; i < 4; i++) {
    sum = sum + i;                // เพิ่ม i
    Serial.println(sum);
  }
  Serial.print("Sum = ");
  Serial.println(sum);
}

void loop() {
}
`,
      text: "ก่อนกดอะไร ให้ทำนายว่าบรรทัดสุดท้ายจะพิมพ์ Sum = เท่าใด แล้วกด “ทำจนจบโปรแกรม” เพื่อตรวจคำตอบ",
      q: "คำถาม: เปลี่ยนเครื่องหมายเพียงตัวเดียว ลูปทำงานน้อยลงกี่รอบ ดูจากตารางว่าหายไปตรงไหน" },
    { title: "แก้ให้บวกเลขคู่", editable: true, code: `void setup() {
  Serial.begin(9600);
  int sum = 0;                    // ผลรวม เริ่มจาก 0
  for (int i = 1; i <= 4; i++) {
    sum = sum + i;                // เพิ่ม i
    Serial.println(sum);
  }
  Serial.print("Sum = ");
  Serial.println(sum);
}

void loop() {
}
`,
      text: "กด “แก้โค้ด” แล้วแก้ให้โปรแกรมบวกเฉพาะเลขคู่ 2, 4, 6, 8, 10 ซึ่งต้องได้ผลรวม 30 กด “ใช้โค้ดนี้” แล้วกด “ทำจนจบโปรแกรม”",
      q: "คำถาม: ก่อนรัน ทำนายว่าตารางจะมีกี่แถว (เงื่อนไขถูกตรวจกี่ครั้ง) แก้ได้กี่วิธี" },
  ],
});
</script>
</body>
</html>
